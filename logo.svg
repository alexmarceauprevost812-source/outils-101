<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <style>
      @keyframes swing-left {
        0%, 100% { transform: rotate(-15deg); transform-origin: 100px 50px; }
        50% { transform: rotate(15deg); transform-origin: 100px 50px; }
      }
      @keyframes swing-right {
        0%, 100% { transform: rotate(15deg); transform-origin: 500px 50px; }
        50% { transform: rotate(-15deg); transform-origin: 500px 50px; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }
      .sword-left { animation: swing-left 2s ease-in-out infinite; }
      .sword-right { animation: swing-right 2s ease-in-out infinite; }
      .shield-pulse { animation: pulse 2s ease-in-out infinite; }
    </style>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00cc6f;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="600" height="500" fill="#1a1a2e"/>

  <!-- Épée Gauche -->
  <g class="sword-left" filter="url(#glow)">
    <rect x="85" y="10" width="30" height="120" fill="#FFD700" rx="3"/>
    <polygon points="80,130 100,160 120,130" fill="#8B4513"/>
    <circle cx="100" cy="135" r="15" fill="#FFD700"/>
  </g>

  <!-- Épée Droite -->
  <g class="sword-right" filter="url(#glow)">
    <rect x="485" y="10" width="30" height="120" fill="#FFD700" rx="3"/>
    <polygon points="480,130 500,160 520,130" fill="#8B4513"/>
    <circle cx="500" cy="135" r="15" fill="#FFD700"/>
  </g>

  <!-- Bouclier Central -->
  <g class="shield-pulse" filter="url(#glow)">
    <!-- Forme du bouclier -->
    <path d="M 300 80 L 380 120 L 380 280 Q 300 320 300 320 Q 220 280 220 280 L 220 120 Z" 
          fill="url(#shieldGradient)" stroke="#00ff88" stroke-width="3"/>
    
    <!-- Contour intérieur -->
    <path d="M 300 95 L 370 130 L 370 280 Q 300 310 300 310 Q 230 280 230 280 L 230 130 Z" 
          fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    
    <!-- Symbole central (rond) -->
    <circle cx="300" cy="200" r="45" fill="none" stroke="#00ff88" stroke-width="2"/>
    <circle cx="300" cy="200" r="35" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="1"/>
    
    <!-- Texte central -->
    <text x="300" y="210" text-anchor="middle" font-size="28" fill="#00ff88" font-weight="bold" font-family="Arial">101</text>
  </g>

  <!-- Titre Principal -->
  <text x="300" y="380" text-anchor="middle" font-size="48" fill="#00ff88" font-weight="bold" font-family="Courier New" letter-spacing="2">OUTILS 101</text>

  <!-- Sous-titre -->
  <text x="300" y="420" text-anchor="middle" font-size="20" fill="#00ff88" opacity="0.8" font-family="Courier New">DÉFENSE RÉSEAU ACTIVE</text>

  <!-- Version -->
  <text x="300" y="460" text-anchor="middle" font-size="14" fill="#00ff88" opacity="0.6" font-family="Courier New">v3.0 • Cybersécurité Défensive</text>
</svg>
